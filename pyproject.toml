[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nnrti-mechanisms"
version = "1.0.0"
description = "Molecular simulation of doravirine resistance in HIV-1 reverse transcriptase"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Rohit Satija" },
    { name = "Kaiming Tao" },
    { name = "Robert W. Shafer" },
]

# The full environment is specified in environment.yml. This list exists so
# that `pip install -e .` gives a working analysis environment on top of a
# conda base that already provides OpenMM, MDAnalysis, MDTraj and RDKit.
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "networkx",
    "openpyxl",
    "python-docx",
    "lxml",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nnrti*"]

[tool.setuptools.package-dir]
"" = "src"
