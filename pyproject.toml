[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nnrti-mechanisms"
version = "1.0.0"
description = "Molecular simulation of doravirine resistance in HIV-1 reverse transcriptase"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Rohit Satija" },
    { name = "Kaiming Tao" },
    { name = "Robert W. Shafer" },
]

# The local scientific environment is specified in environment.yml. Install
# this checkout into it with: python -m pip install --no-deps -e .
# The dependencies below support analysis-only package installation; OpenMM,
# MDAnalysis, MDTraj, RDKit and OpenFF are supplied by the Conda recipe.
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "networkx",
    "openpyxl",
    "python-docx",
    "lxml",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nnrti*"]

[tool.setuptools.package-dir]
"" = "src"
