<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" width="1160" height="600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2a37"/>
    </marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa3ae"/>
    </marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="600" fill="#ffffff"/>

  <!-- ============ PANEL A : THERMODYNAMIC CYCLE ============ -->
  <text x="34" y="46" font-size="23" font-weight="bold" fill="#111827">A</text>
  <text x="60" y="46" font-size="15" fill="#4b5563">Thermodynamic cycle</text>

  <!-- boxes -->
  <rect x="60" y="120" width="176" height="84" rx="6" fill="#f8fafc" stroke="#1f2a37" stroke-width="1.6"/>
  <text x="148" y="155" font-size="15" fill="#111827" text-anchor="middle">WT RT + DOR</text>
  <text x="148" y="177" font-size="12.5" fill="#6b7280" text-anchor="middle">unbound</text>

  <rect x="336" y="120" width="176" height="84" rx="6" fill="#f8fafc" stroke="#1f2a37" stroke-width="1.6"/>
  <text x="424" y="155" font-size="15" fill="#111827" text-anchor="middle">WT RT · DOR</text>
  <text x="424" y="177" font-size="12.5" fill="#6b7280" text-anchor="middle">complex</text>

  <rect x="60" y="340" width="176" height="84" rx="6" fill="#f8fafc" stroke="#1f2a37" stroke-width="1.6"/>
  <text x="148" y="375" font-size="15" fill="#111827" text-anchor="middle">Mutant RT + DOR</text>
  <text x="148" y="397" font-size="12.5" fill="#6b7280" text-anchor="middle">unbound</text>

  <rect x="336" y="340" width="176" height="84" rx="6" fill="#f8fafc" stroke="#1f2a37" stroke-width="1.6"/>
  <text x="424" y="375" font-size="15" fill="#111827" text-anchor="middle">Mutant RT · DOR</text>
  <text x="424" y="397" font-size="12.5" fill="#6b7280" text-anchor="middle">complex</text>

  <!-- horizontal (physical binding) legs : dashed, not simulated -->
  <line x1="240" y1="162" x2="330" y2="162" stroke="#9aa3ae" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <text x="285" y="145" font-size="13.5" fill="#6b7280" text-anchor="middle">&#916;G<tspan font-size="10.5" dy="4">bind</tspan><tspan dy="-11" font-size="10.5">WT</tspan></text>

  <line x1="240" y1="382" x2="330" y2="382" stroke="#9aa3ae" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <text x="285" y="365" font-size="13.5" fill="#6b7280" text-anchor="middle">&#916;G<tspan font-size="10.5" dy="4">bind</tspan><tspan dy="-11" font-size="10.5">Mut</tspan></text>

  <!-- vertical (alchemical) legs : solid, simulated -->
  <line x1="148" y1="208" x2="148" y2="336" stroke="#1f2a37" stroke-width="2" marker-end="url(#aDark)"/>
  <text x="160" y="264" font-size="13.5" fill="#111827">&#916;G<tspan font-size="10.5" dy="4">apo</tspan></text>
  <text x="160" y="284" font-size="11.5" fill="#6b7280">alchemical</text>

  <line x1="424" y1="208" x2="424" y2="336" stroke="#1f2a37" stroke-width="2" marker-end="url(#aDark)"/>
  <text x="436" y="264" font-size="13.5" fill="#111827">&#916;G<tspan font-size="10.5" dy="4">holo</tspan></text>
  <text x="436" y="284" font-size="11.5" fill="#6b7280">alchemical</text>

  <!-- residue morph annotation in the middle of the cycle -->
  <text x="286" y="258" font-size="12.5" fill="#374151" text-anchor="middle">WT residue</text>
  <text x="286" y="276" font-size="14" fill="#374151" text-anchor="middle">&#8595;</text>
  <text x="286" y="294" font-size="12.5" fill="#374151" text-anchor="middle">mutant residue</text>

  <!-- equation -->
  <line x1="60" y1="452" x2="512" y2="452" stroke="#e5e7eb" stroke-width="1"/>
  <text x="286" y="486" font-size="16" fill="#111827" text-anchor="middle">&#916;&#916;G<tspan font-size="12" dy="4">bind</tspan><tspan dy="-4"> = &#916;G</tspan><tspan font-size="12" dy="4">holo</tspan><tspan dy="-4"> &#8722; &#916;G</tspan><tspan font-size="12" dy="4">apo</tspan></text>
  <text x="286" y="516" font-size="12.5" fill="#6b7280" text-anchor="middle">Dashed legs are physical but not simulated; the cycle is closed</text>
  <text x="286" y="534" font-size="12.5" fill="#6b7280" text-anchor="middle">through the two alchemical legs. Positive &#916;&#916;G<tspan font-size="10" dy="3">bind</tspan><tspan dy="-3"> = weaker binding.</tspan></text>

  <!-- panel divider -->
  <line x1="566" y1="40" x2="566" y2="560" stroke="#e5e7eb" stroke-width="1.2"/>

  <!-- ============ PANEL B : NON-EQUILIBRIUM SWITCHING ============ -->
  <text x="606" y="46" font-size="23" font-weight="bold" fill="#111827">B</text>
  <text x="632" y="46" font-size="15" fill="#4b5563">Non-equilibrium switching, per leg</text>

  <!-- end states -->
  <rect x="620" y="94" width="190" height="76" rx="6" fill="#eff4ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="715" y="124" font-size="14.5" fill="#111827" text-anchor="middle">&#955; = 0   wild type</text>
  <text x="715" y="146" font-size="12.5" fill="#6b7280" text-anchor="middle">5 ns equilibrium MD</text>

  <rect x="916" y="94" width="190" height="76" rx="6" fill="#fff4ed" stroke="#c2410c" stroke-width="1.6"/>
  <text x="1011" y="124" font-size="14.5" fill="#111827" text-anchor="middle">&#955; = 1   mutant</text>
  <text x="1011" y="146" font-size="12.5" fill="#6b7280" text-anchor="middle">5 ns equilibrium MD</text>

  <line x1="715" y1="170" x2="715" y2="182" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#aBlue)"/>
  <line x1="1011" y1="170" x2="1011" y2="182" stroke="#c2410c" stroke-width="1.6" marker-end="url(#aOrange)"/>
  <text x="715" y="200" font-size="12.5" fill="#374151" text-anchor="middle">100 evenly spaced frames</text>
  <text x="1011" y="200" font-size="12.5" fill="#374151" text-anchor="middle">100 evenly spaced frames</text>

  <!-- switching arrows -->
  <line x1="700" y1="232" x2="1026" y2="232" stroke="#1d4ed8" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="863" y="222" font-size="13" fill="#1d4ed8" text-anchor="middle">100 forward switches, &#955;: 0 &#8594; 1</text>

  <line x1="1026" y1="272" x2="700" y2="272" stroke="#c2410c" stroke-width="2" marker-end="url(#aOrange)"/>
  <text x="863" y="292" font-size="13" fill="#c2410c" text-anchor="middle">100 reverse switches, &#955;: 1 &#8594; 0</text>

  <text x="863" y="322" font-size="12.5" fill="#6b7280" text-anchor="middle">100 ps per switch; work recorded for each</text>

  <!-- work distributions -->
  <path d="M 700 430 C 745 430 745 348 800 348 C 855 348 855 430 900 430 Z" fill="#1d4ed8" fill-opacity="0.16" stroke="#1d4ed8" stroke-width="1.8"/>
  <path d="M 830 430 C 875 430 875 360 930 360 C 985 360 985 430 1030 430 Z" fill="#c2410c" fill-opacity="0.16" stroke="#c2410c" stroke-width="1.8"/>
  <text x="778" y="340" font-size="13" fill="#1d4ed8" text-anchor="middle">W<tspan font-size="10" dy="4">F</tspan></text>
  <text x="952" y="352" font-size="13" fill="#c2410c" text-anchor="middle">W<tspan font-size="10" dy="4">R</tspan></text>

  <line x1="646" y1="430" x2="1104" y2="430" stroke="#1f2a37" stroke-width="1.4" marker-end="url(#aDark)"/>
  <text x="1090" y="450" font-size="12.5" fill="#6b7280" text-anchor="end">work</text>

  <!-- BAR box -->
  <rect x="706" y="470" width="316" height="48" rx="6" fill="#f8fafc" stroke="#1f2a37" stroke-width="1.6"/>
  <text x="864" y="500" font-size="14.5" fill="#111827" text-anchor="middle">Bennett acceptance ratio &#8594; &#916;G<tspan font-size="10.5" dy="4">holo</tspan><tspan dy="-4">, &#916;G</tspan><tspan font-size="10.5" dy="4">apo</tspan></text>

  <text x="864" y="542" font-size="12.5" fill="#6b7280" text-anchor="middle">Run independently for the holo and apo legs, in three replicates per genotype.</text>
</svg>
