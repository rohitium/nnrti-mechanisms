# NNRTI Mechanisms Snakemake Configuration
# -----------------------------------------
# Override any value via --config key=value on the command line.

# Input data paths (relative to project root)
wt_cif_source: "data/structures/4NCG.cif"
susceptibility_xlsx: "data/DRM-susceptibilities.csv.xlsx"
ligand_sdf: "data/ligands/dor.sdf"
ligand_resname: "2KW"

# Replication
replicates: 3
seed: 42
jitter_angstrom: 0.1

# MD protocol
md:
  heating_ps: 25.0
  production_ns: 2.0
  report_interval: 2000
  checkpoint_interval: 5000

# Analysis parameters
analysis:
  mmgbsa_snapshots: 100
  mmgbsa_discard_fraction: 0.25
  metric_frame_stride: 5
  metric_max_frames: 200

# SLURM resources for GPU rules (only used with --profile workflow/profiles/sherlock)
slurm:
  partition: "gpu"
  gres: "gpu:1"
  time_minutes: 480
  mem_mb: 16000
