# Primary LOCAL environment: preparation, trajectory/MMGBSA analysis and paper
# artifacts. Sherlock simulations use site modules, not this Conda environment.
# Legacy pmx topology/raw-work tools have a separate Python 3.11 environment;
# see docs/ENVIRONMENTS.md. They are not needed for the paper artifact build.
#
#   conda env create -f environment.yml
#   conda activate nnrti-prep
#
# Versions are pinned to the minor release used for the published results.
# Non-equilibrium switching uses Sherlock's GPU GROMACS 2023.1 module.
name: nnrti-prep
channels:
  - conda-forge
dependencies:
  - python=3.12

  # Simulation and force fields
  - openmm=8.5
  - openmmforcefields=0.16
  - openff-toolkit=0.18
  - openff-interchange=0.5
  - pdbfixer=1.12
  - ambertools=26

  # Trajectory and structure analysis
  - mdanalysis=2.10
  - mdtraj=1.11
  - rdkit=2025.9

  # Numerics and plotting
  - numpy=2.3
  - scipy=1.17
  - pandas=2.3
  - matplotlib=3.10
  - networkx=3.6

  # Manuscript artifacts (Supplementary Tables, ACS template application)
  - openpyxl=3.1
  - python-docx=1.2
  - lxml=6.1

  - pytest=9.1

  - pip

variables:
  PYTHONNOUSERSITE: "1"
